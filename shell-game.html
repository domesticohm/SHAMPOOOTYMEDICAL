<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kidney Stone Shell Game — Shampooooty Medical</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #c8d8e4 0%, #b0c6d6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrapper { width: 360px; max-width: 100%; }
    h1 {
      color: #1a3a52;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      text-shadow: 0 1px 6px rgba(30,90,140,0.18);
    }
    .sub {
      color: rgba(30,80,120,0.52);
      font-size: 9px;
      text-align: center;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    #canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,40,80,0.22), inset 0 0 0 1px rgba(100,160,200,0.3);
    }
    canvas { display: block; width: 100%; cursor: default; }
    #btn-play {
      display: none;
      margin: 14px auto 0;
      padding: 11px 44px;
      background: linear-gradient(135deg, #1976D2, #0D47A1);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(13,71,161,0.38);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #btn-play:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(13,71,161,0.52); }
  </style>
</head>
<body>
<div id="wrapper">
  <h1>Kidney Stone Shell Game</h1>
  <p class="sub">A Shampooooty Medical Production</p>
  <div id="canvas-wrap">
    <canvas id="canvas" width="360" height="440"></canvas>
  </div>
  <button id="btn-play">Play Again</button>
</div>
<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const W = 360, H = 440;
const SLOT_X   = [72, 180, 288];
const BASE_Y   = 305;  // cup opening y (upside-down, so opening faces down)
const CUP_H    = 92;
const CRX_B    = 39;   // half-width at opening (bottom)
const CRX_T    = 33;   // half-width at closed end (top)
const CRY_B    = 10;
const CRY_T    = 7;
const STONE_R  = 12;
const STONE_Y  = BASE_Y - 13;

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ── Helpers ───────────────────────────────────────────────────────────────────
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi,v));
const lerp  = (a,b,t)   => a + (b-a) * clamp(t,0,1);
function eio(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

// ── Stone shape ───────────────────────────────────────────────────────────────
let stonePts = [];
function buildStone() {
  stonePts = [];
  const N = 12;
  for (let i = 0; i < N; i++) {
    const a = (i/N) * Math.PI * 2;
    stonePts.push([Math.cos(a)*(0.55+Math.random()*0.45), Math.sin(a)*(0.55+Math.random()*0.45)]);
  }
}

// ── Cups ──────────────────────────────────────────────────────────────────────
// cup: { slot:0|1|2, x:current, liftY:0=down negative=lifted }
let cups = [];
let stoneCup = 1;
function initCups() {
  cups = [0,1,2].map(i => ({ slot:i, x:SLOT_X[i], liftY:0 }));
}

// ── State ─────────────────────────────────────────────────────────────────────
let state      = 'init';
let stateTimer = 0;
function setState(s) { state = s; stateTimer = 0; }

// ── Shuffle ───────────────────────────────────────────────────────────────────
const PAIRS = [[0,1],[1,2],[0,2]];
let swapList = [], swapIdx = 0;
let swapPhase = 'gap';
let swapFrame = 0, swapMax = 32;
let gapFrame  = 0, gapMax  = 14;
let sCA=-1, sCB=-1, sSXA=0, sSXB=0, sEXA=0, sEXB=0;

function genSwaps() {
  const n = 12 + Math.floor(Math.random()*5);
  return Array.from({length:n}, () => {
    const p = PAIRS[Math.floor(Math.random()*3)];
    return {slotA:p[0], slotB:p[1]};
  });
}

function beginSwap() {
  if (swapIdx >= swapList.length) { setState('choosing'); return; }
  const {slotA, slotB} = swapList[swapIdx];
  sCA = cups.findIndex(c => c.slot === slotA);
  sCB = cups.findIndex(c => c.slot === slotB);
  sSXA = cups[sCA].x; sSXB = cups[sCB].x;
  sEXA = SLOT_X[slotB]; sEXB = SLOT_X[slotA];
  cups[sCA].slot = slotB;
  cups[sCB].slot = slotA;
  const t = swapIdx / swapList.length;
  swapMax = Math.round(lerp(34,11,t));
  gapMax  = Math.round(lerp(12,3,t));
  swapFrame = 0;
  swapPhase = 'animate';
  swapIdx++;
}

// ── Result ────────────────────────────────────────────────────────────────────
let selectedCup = -1, resultWin = false;
let wrongStarted = false, wrongFrame = 0;
const LIFT_F  = 22;
const WRONG_D = 58;

// ── Score ─────────────────────────────────────────────────────────────────────
let wins = 0, plays = 0;

// ── Particles ─────────────────────────────────────────────────────────────────
let particles = [];
const CONF_COLS = ['#1565C0','#FFD700','#2E7D32','#00ACC1','#43A047','#0288D1','#FFFFFF','#29B6F6'];

function spawnConfetti(cx, cy) {
  for (let i = 0; i < 70; i++) {
    const a = Math.random()*Math.PI*2, spd = 2+Math.random()*9;
    particles.push({
      x:cx, y:cy,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-4.5,
      angle:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.3,
      w:5+Math.random()*8, h:3+Math.random()*4,
      life:1, decay:0.013+Math.random()*0.009,
      col:CONF_COLS[Math.floor(Math.random()*CONF_COLS.length)],
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.98;
    p.angle += p.rotV;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);
}

// ── Hover ─────────────────────────────────────────────────────────────────────
let hovCup = -1, tick = 0;

function hitTest(mx, my, i) {
  const cx = cups[i].x;
  return Math.abs(mx-cx) < CRX_B+8 && my > BASE_Y-CUP_H-14 && my < BASE_Y+14;
}

// ── Draw: background ──────────────────────────────────────────────────────────
function drawBG() {
  // Clinical wall — cool blue-gray gradient
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, '#e2ecf3');
  bg.addColorStop(1, '#cddae4');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Subtle tile grid (sterile floor/wall texture)
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.strokeStyle = '#7aaabf';
  ctx.lineWidth = 0.5;
  const TILE = 30;
  for (let x = 0; x <= W; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,BASE_Y+16); ctx.stroke();
  }
  for (let y = 0; y <= BASE_Y+16; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();

  // Lab bench / examination tray surface
  const tableY = BASE_Y + 16;
  const tg = ctx.createLinearGradient(0,tableY,0,H);
  tg.addColorStop(0, '#b8cdd8');
  tg.addColorStop(0.15, '#c4d6e2');
  tg.addColorStop(1, '#b0c6d2');
  ctx.fillStyle = tg;
  ctx.fillRect(0, tableY, W, H-tableY);

  // Bench edge highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,tableY); ctx.lineTo(W,tableY); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,130,165,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,tableY+1); ctx.lineTo(W,tableY+1); ctx.stroke();

  // Overhead fluorescent spotlight
  const mid = (SLOT_X[0]+SLOT_X[2])/2;
  const sp = ctx.createRadialGradient(mid, 0, 10, mid, BASE_Y*0.4, 240);
  sp.addColorStop(0, 'rgba(220,240,255,0.28)');
  sp.addColorStop(1, 'transparent');
  ctx.fillStyle = sp; ctx.fillRect(0,0,W,H);
}

// ── Draw: shadow ──────────────────────────────────────────────────────────────
function drawShadow(cx, liftY) {
  const shrink = clamp(1 + liftY/150, 0.3, 1);
  const sg = ctx.createRadialGradient(cx,BASE_Y+10,2,cx,BASE_Y+10,CRX_B*1.1*shrink);
  sg.addColorStop(0,'rgba(60,100,130,0.35)'); sg.addColorStop(1,'transparent');
  ctx.save();
  ctx.globalAlpha = 0.6 * shrink;
  ctx.beginPath();
  ctx.ellipse(cx, BASE_Y+10, CRX_B*shrink, 8*shrink, 0, 0, Math.PI*2);
  ctx.fillStyle = sg; ctx.fill();
  ctx.restore();
}

// ── Draw: stone ───────────────────────────────────────────────────────────────
function drawStone(cx, cy, alpha) {
  if (!stonePts.length || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);

  const glow = ctx.createRadialGradient(0,0,1,0,0,STONE_R*2.8);
  glow.addColorStop(0,'rgba(255,200,80,0.55)'); glow.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(0,0,STONE_R*2.8,0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();

  ctx.beginPath();
  stonePts.forEach(([px,py],i) => {
    const x=px*STONE_R, y=py*STONE_R;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  const fill = ctx.createRadialGradient(-STONE_R*0.3,-STONE_R*0.3,0.5,0,0,STONE_R);
  fill.addColorStop(0,'#FFFDE7'); fill.addColorStop(0.4,'#FFF176');
  fill.addColorStop(0.75,'#F9A825'); fill.addColorStop(1,'#E65100');
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle='rgba(150,68,0,0.4)'; ctx.lineWidth=0.8; ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-STONE_R*0.2,-STONE_R*0.28,STONE_R*0.32,STONE_R*0.18,-0.4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.fill();
  ctx.restore();
}

// ── Draw: cup ─────────────────────────────────────────────────────────────────
function drawCup(cx, liftY, glowing) {
  const openY  = BASE_Y + liftY;
  const closeY = openY - CUP_H;

  ctx.save();

  // Glow halo
  if (glowing) {
    ctx.save();
    ctx.globalAlpha = 0.28 + Math.sin(tick*3.2)*0.12;
    const g = ctx.createRadialGradient(cx,openY-CUP_H*0.5,8,cx,openY-CUP_H*0.5,CRX_B*2);
    g.addColorStop(0,'rgba(30,130,210,0.22)'); g.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.ellipse(cx,openY-CUP_H*0.5,CRX_B*2,CUP_H*0.75,0,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    ctx.restore();
  }

  // Side walls (trapezoid)
  ctx.beginPath();
  ctx.moveTo(cx-CRX_T, closeY);
  ctx.lineTo(cx+CRX_T, closeY);
  ctx.lineTo(cx+CRX_B, openY);
  ctx.lineTo(cx-CRX_B, openY);
  ctx.closePath();

  const side = ctx.createLinearGradient(cx-CRX_B,0,cx+CRX_B,0);
  side.addColorStop(0,   'rgba(190,210,218,0.88)');
  side.addColorStop(0.12,'rgba(240,250,255,0.96)');
  side.addColorStop(0.55,'rgba(220,235,242,0.92)');
  side.addColorStop(0.88,'rgba(200,218,228,0.88)');
  side.addColorStop(1,   'rgba(170,188,200,0.84)');
  ctx.fillStyle = side;
  ctx.fill();

  if (glowing) {
    ctx.strokeStyle='rgba(30,120,200,0.45)';
    ctx.lineWidth=1.5; ctx.stroke();
  }

  // Closed top (bottom of cup, now physically at top)
  ctx.beginPath();
  ctx.ellipse(cx,closeY,CRX_T,CRY_T,0,0,Math.PI*2);
  const topF = ctx.createRadialGradient(cx-3,closeY-2,0,cx,closeY,CRX_T);
  topF.addColorStop(0,'rgba(245,254,255,1)');
  topF.addColorStop(1,'rgba(200,220,230,0.92)');
  ctx.fillStyle=topF; ctx.fill();
  ctx.strokeStyle='rgba(160,185,200,0.55)'; ctx.lineWidth=0.8; ctx.stroke();

  // Opening rim (faces down)
  ctx.beginPath();
  ctx.ellipse(cx,openY,CRX_B,CRY_B,0,0,Math.PI*2);
  ctx.fillStyle='rgba(175,200,215,0.75)'; ctx.fill();
  ctx.strokeStyle='rgba(140,165,182,0.7)'; ctx.lineWidth=1.5; ctx.stroke();

  // Rim band
  ctx.beginPath();
  ctx.ellipse(cx,openY-7,CRX_B*0.92,CRY_B*0.82,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(210,230,240,0.28)'; ctx.lineWidth=5; ctx.stroke();

  // Graduation marks — small right-side dashes only, like a real specimen cup
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-CRX_T, closeY);
  ctx.lineTo(cx+CRX_T, closeY);
  ctx.lineTo(cx+CRX_B, openY);
  ctx.lineTo(cx-CRX_B, openY);
  ctx.closePath();
  ctx.clip();

  const marks = [
    { t:0.18, major:false },
    { t:0.31, major:true,  ml:'30' },
    { t:0.44, major:false },
    { t:0.57, major:true,  ml:'60' },
    { t:0.70, major:false },
    { t:0.83, major:true,  ml:'90' },
  ];

  marks.forEach(({t, major, ml}) => {
    const ly    = closeY + (openY - closeY) * t;
    const xEdge = lerp(CRX_T, CRX_B, t);
    const innerX = cx + xEdge - 3; // right inner wall
    if (major) {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = 'rgba(40,100,145,1)';
      ctx.lineWidth   = 0.9;
      ctx.beginPath();
      ctx.moveTo(innerX - 10, ly);
      ctx.lineTo(innerX,      ly);
      ctx.stroke();
      ctx.globalAlpha = 0.60;
      ctx.fillStyle   = 'rgba(25,80,125,1)';
      ctx.font        = '6.5px Arial, sans-serif';
      ctx.textAlign   = 'right';
      ctx.fillText(ml, innerX - 12, ly + 2.5);
    } else {
      ctx.globalAlpha = 0.30;
      ctx.strokeStyle = 'rgba(60,120,160,1)';
      ctx.lineWidth   = 0.75;
      ctx.beginPath();
      ctx.moveTo(innerX - 6, ly);
      ctx.lineTo(innerX,     ly);
      ctx.stroke();
    }
  });
  ctx.restore();

  // Specular stripe
  ctx.save(); ctx.globalAlpha=0.24;
  ctx.beginPath();
  ctx.moveTo(cx-CRX_T+5, closeY+5);
  ctx.lineTo(cx-CRX_T+14, closeY+5);
  ctx.lineTo(cx-CRX_B+15, openY-10);
  ctx.lineTo(cx-CRX_B+7, openY-10);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,1)'; ctx.fill();
  ctx.restore();

  ctx.restore();
}

// ── Draw: particles ───────────────────────────────────────────────────────────
function drawParticles() {
  particles.forEach(p => {
    if (p.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = clamp(p.life*1.4,0,1);
    ctx.translate(p.x,p.y); ctx.rotate(p.angle);
    ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
}

// ── Draw: HUD ─────────────────────────────────────────────────────────────────
const MSGS = {
  init:         'Get ready...',
  reveal_lift:  'Watch closely...',
  reveal_show:  'Remember this cup!',
  reveal_down:  '',
  pre_shuffle:  'Here we go...',
  shuffling:    'Follow the stone...',
  choosing:     'Which cup hides the stone?',
  result_lift:  '',
  result_show:  '',
  done:         '',
};

function drawHUD() {
  ctx.save();
  ctx.textAlign='center';

  // Score badge
  if (plays > 0) {
    ctx.fillStyle='rgba(20,70,115,0.48)';
    ctx.font='bold 11px Arial';
    ctx.textAlign='right';
    ctx.fillText(`${wins} / ${plays}`, W-14, 26);
    ctx.textAlign='center';
  }

  // Message
  const msg = MSGS[state] || '';
  if (msg) {
    ctx.globalAlpha=1;
    ctx.fillStyle='#1a3552';
    ctx.font='bold 13px Arial';
    ctx.shadowBlur=0;
    ctx.fillText(msg, W/2, 34);
  }

  // Pulsing arrows during choosing
  if (state==='choosing') {
    const pulse = 0.45 + Math.sin(tick*4)*0.55;
    cups.forEach((cup,i) => {
      const hov = hovCup===i;
      ctx.globalAlpha = hov ? 1 : pulse*0.5;
      ctx.fillStyle = hov ? '#0277BD' : '#2c7aad';
      ctx.font = hov ? 'bold 15px Arial' : '13px Arial';
      ctx.textAlign='center';
      ctx.fillText('▼', cup.x, BASE_Y-CUP_H-18);
    });
  }

  ctx.restore();
}

// ── Draw: result banner ───────────────────────────────────────────────────────
function drawResultBanner() {
  if (state !== 'done') return;
  const y = 368;
  ctx.save();

  // Clinical panel background
  const rg = ctx.createLinearGradient(0,y,0,H);
  rg.addColorStop(0,'rgba(210,228,240,0.97)');
  rg.addColorStop(1,'rgba(195,218,234,0.99)');
  ctx.fillStyle=rg; ctx.fillRect(0,y,W,H-y);
  ctx.strokeStyle='rgba(80,140,190,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();

  const col = resultWin ? '#1B5E20' : '#B71C1C';
  ctx.textAlign='center';
  ctx.fillStyle=col;
  ctx.font='bold 15px Arial';
  ctx.fillText(resultWin ? 'Stone located. Diagnosis confirmed.' : 'Incorrect. Stone not found.', W/2, y+28);
  ctx.fillStyle=resultWin ? 'rgba(27,94,32,0.65)' : 'rgba(183,28,28,0.62)';
  ctx.font='11px Arial';
  ctx.fillText(
    resultWin ? 'Excellent tracking skills.' : `Stone was under cup ${stoneCup+1}.`,
    W/2, y+50
  );
  ctx.restore();
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
  tick += 0.016;
  stateTimer++;
  updateParticles();

  if (state==='init') {
    if (stateTimer >= 40) setState('reveal_lift');

  } else if (state==='reveal_lift') {
    const p = clamp(stateTimer/24,0,1);
    cups[stoneCup].liftY = -CUP_H*1.12 * eio(p);
    if (p>=1) setState('reveal_show');

  } else if (state==='reveal_show') {
    if (stateTimer>=85) setState('reveal_down');

  } else if (state==='reveal_down') {
    const p = clamp(stateTimer/22,0,1);
    cups[stoneCup].liftY = -CUP_H*1.12 * (1-eio(p));
    if (p>=1) { cups[stoneCup].liftY=0; setState('pre_shuffle'); }

  } else if (state==='pre_shuffle') {
    if (stateTimer>=28) {
      swapList=genSwaps(); swapIdx=0; swapPhase='gap'; gapFrame=0; gapMax=15;
      setState('shuffling');
    }

  } else if (state==='shuffling') {
    if (swapPhase==='gap') {
      gapFrame++;
      if (gapFrame>=gapMax) { gapFrame=0; beginSwap(); }
    } else {
      swapFrame++;
      const t = eio(swapFrame/swapMax);
      cups[sCA].x = lerp(sSXA,sEXA,t);
      cups[sCB].x = lerp(sSXB,sEXB,t);
      const arc = Math.sin(Math.PI*swapFrame/swapMax)*20;
      if (sEXA>sSXA) { cups[sCA].liftY=-arc; cups[sCB].liftY=0; }
      else           { cups[sCA].liftY=0;    cups[sCB].liftY=-arc; }
      if (swapFrame>=swapMax) {
        cups[sCA].x=sEXA; cups[sCB].x=sEXB;
        cups[sCA].liftY=0; cups[sCB].liftY=0;
        swapPhase='gap'; gapFrame=0;
      }
    }

  } else if (state==='result_lift') {
    const p = clamp(stateTimer/LIFT_F,0,1);
    cups[selectedCup].liftY = -CUP_H*1.12 * eio(p);
    if (p>=1) {
      resultWin = (selectedCup===stoneCup);
      plays++;
      if (resultWin) { wins++; spawnConfetti(cups[selectedCup].x, BASE_Y-70); }
      wrongStarted=false; wrongFrame=0;
      setState('result_show');
    }

  } else if (state==='result_show') {
    if (!resultWin && !wrongStarted && stateTimer>=WRONG_D) {
      wrongStarted=true; wrongFrame=0;
    }
    if (wrongStarted) {
      wrongFrame++;
      const p = clamp(wrongFrame/LIFT_F,0,1);
      cups[stoneCup].liftY = -CUP_H*1.12 * eio(p);
    }
    const readyAt = resultWin ? 50 : WRONG_D+LIFT_F+22;
    if (stateTimer>=readyAt) {
      setState('done');
      document.getElementById('btn-play').style.display='block';
    }
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  drawBG();

  // Shadows
  cups.forEach(c => drawShadow(c.x, c.liftY));

  // Stone (visible when its cup is lifted)
  const sc = cups[stoneCup];
  const stoneAlpha = clamp((-sc.liftY-26)/26, 0, 1);
  drawStone(sc.x, STONE_Y, stoneAlpha);

  // Cups: most-lifted drawn last (on top)
  [0,1,2].sort((a,b) => cups[a].liftY - cups[b].liftY).forEach(i => {
    drawCup(cups[i].x, cups[i].liftY, state==='choosing' && hovCup===i);
  });

  drawParticles();
  drawResultBanner();
  drawHUD();

  update();
  requestAnimationFrame(render);
}

// ── Input ─────────────────────────────────────────────────────────────────────
function pickCup(mx, my) {
  if (state!=='choosing') return;
  for (let i=0; i<3; i++) {
    if (hitTest(mx,my,i)) {
      selectedCup=i; hovCup=-1;
      canvas.style.cursor='default';
      setState('result_lift');
      return;
    }
  }
}

canvas.addEventListener('click', e => {
  const r=canvas.getBoundingClientRect();
  pickCup((e.clientX-r.left)*(W/r.width), (e.clientY-r.top)*(H/r.height));
});

canvas.addEventListener('mousemove', e => {
  if (state!=='choosing') { hovCup=-1; return; }
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width);
  const my=(e.clientY-r.top)*(H/r.height);
  hovCup=-1;
  for (let i=0; i<3; i++) { if(hitTest(mx,my,i)){hovCup=i;break;} }
  canvas.style.cursor = hovCup>=0 ? 'pointer' : 'default';
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t=e.touches[0], r=canvas.getBoundingClientRect();
  pickCup((t.clientX-r.left)*(W/r.width), (t.clientY-r.top)*(H/r.height));
}, {passive:false});

document.getElementById('btn-play').addEventListener('click', () => {
  document.getElementById('btn-play').style.display='none';
  particles=[];
  buildStone();
  stoneCup=Math.floor(Math.random()*3);
  initCups();
  selectedCup=-1; resultWin=false; wrongStarted=false; hovCup=-1;
  setState('init');
});

// ── Boot ──────────────────────────────────────────────────────────────────────
buildStone();
stoneCup = 1;
initCups();
setState('init');
render();
</script>
</body>
</html>
